<svg xmlns="http://www.w3.org/2000/svg" id="still" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
  <title id="title">Rhayron Nogueira — Onde sinais viram sistemas</title>
  <desc id="desc">Versão compacta da capa: engenharia elétrica, visão computacional, ultrassom na GPU e IA que faz companhia. Quatro sinais animados convergem em um circuito.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#233830" stroke-width="0.6"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: Consolas, 'Liberation Mono', monospace; }
      .signal { stroke-dasharray: 8 160; animation: flow 7s linear infinite; }
      .s2 { animation-delay: -1.75s; }
      .s3 { animation-delay: -3.5s; }
      .s4 { animation-delay: -5.25s; }
      :target .signal { animation: none; }
      @keyframes flow { to { stroke-dashoffset: -336; } }
      @media (prefers-reduced-motion: reduce) { .signal { animation: none; } }
    </style>
  </defs>
  <rect width="640" height="560" rx="22" fill="#101d19"/>
  <rect x="1" y="1" width="638" height="558" rx="21" fill="url(#grid)" stroke="#30473c"/>
  <path d="M32 38h12m-6-6v12" stroke="#b7e69b" stroke-width="2"/>
  <text class="mono" x="58" y="44" fill="#b7e69b" font-size="17" letter-spacing="1.4">LABORATÓRIO ABERTO</text>
  <path d="M32 66H608" stroke="#30473c"/>
  <g class="sans">
    <text x="32" y="115" fill="#b8c9bf" font-size="27">Rhayron Nogueira</text>
    <text x="29" y="191" fill="#f2f5eb" font-size="65" font-weight="700" letter-spacing="-2">Onde sinais</text>
    <text x="29" y="263" fill="#b7e69b" font-size="65" font-weight="700" letter-spacing="-2">viram sistemas.</text>
    <text x="32" y="310" fill="#b8c9bf" font-size="23">Engenharia elétrica · visão computacional</text>
    <text x="32" y="344" fill="#b8c9bf" font-size="23">Ultrassom na GPU · IA que faz companhia</text>
  </g>
  <g class="mono" font-size="18" text-anchor="middle">
    <text x="83" y="398" fill="#b7e69b">visão</text>
    <text x="237" y="398" fill="#8ed1d2">ecos</text>
    <text x="391" y="398" fill="#dab4ee">agentes</text>
    <text x="545" y="398" fill="#efbb88">interfaces</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <g stroke="#496052">
      <path d="M83 414v16l50 34h148"/>
      <path d="M237 414v16l44 26"/>
      <path d="M391 414v16l-44 26"/>
      <path d="M545 414v16l-50 34H347"/>
    </g>
    <path class="signal" stroke="#b7e69b" d="M83 414v16l50 34h148"/>
    <path class="signal s2" stroke="#8ed1d2" d="M237 414v16l44 26"/>
    <path class="signal s3" stroke="#dab4ee" d="M391 414v16l-44 26"/>
    <path class="signal s4" stroke="#efbb88" d="M545 414v16l-50 34H347"/>
  </g>
  <rect x="281" y="437" width="66" height="54" rx="10" fill="#20382b" stroke="#b7e69b"/>
  <text class="sans" x="314" y="474" text-anchor="middle" fill="#d6f2c5" font-size="27" font-weight="700">RN</text>
  <path d="M32 508H608" stroke="#30473c"/>
  <text class="mono" x="32" y="540" fill="#9fb5a8" font-size="16">OBSERVAR → EXPERIMENTAR → CONSTRUIR</text>
</svg>
