      <animateTransform attributeName="transform" type="scale" values="1.04;1;1.04" dur="14s" repeatCount="indefinite"/></path></g>
    <path d="M98 471C-30 385 16 50 214 36C432 21 483 276 373 452C327 525 191 493 147 402C79 260 280 200 395 344" fill="none" stroke="#bccf9d" stroke-width="1.2" opacity=".4" stroke-dasharray="1772" stroke-dashoffset="0">
