<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
<title id="t">Rhayron Nogueira · um caderno vivo</title>
<desc id="d">Do sinal à presença. Engenheiro eletricista, construo pontes entre ciência, código e o mundo real.</desc>
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix type="saturate" values="0"/></filter>
  <clipPath id="page"><rect width="1200" height="440" rx="26"/></clipPath>
</defs>
<g clip-path="url(#page)">
  <rect width="1200" height="440" fill="#20251f"/>
  <rect width="1200" height="440" filter="url(#grain)" opacity=".045"/>

  <!-- garden -->
  <g transform="translate(790 12) scale(0.78)">
    <g transform="translate(225 270)"><path d="M223.7 0.0C217.5 78.5 197.5 59.1 130.4 121.3C63.3 183.5 93.1 193.4 0.0 207.2C-93.1 221.1 -126.6 229.6 -180.0 167.4C-233.4 105.3 -188.1 91.2 -178.1 0.0C-168.2 -91.2 -200.3 -70.9 -146.8 -136.6C-93.4 -202.3 -89.3 -217.9 -0.0 -219.0C89.3 -220.1 83.8 -206.1 150.9 -140.4C218.0 -74.7 229.8 -78.5 223.7 0.0Z" fill="#586b45" opacity=".2">
