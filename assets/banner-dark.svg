    <g transform="translate(14 36) scale(.82)"><g><animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="48s" repeatCount="indefinite"/>
      <path d="M50 50C8 30 17 0 42 12C58 20 50 42 50 50C70 8 100 17 88 42C80 58 58 50 50 50C92 70 83 100 58 88C42 80 50 58 50 50C30 92 0 83 12 58C20 42 42 50 50 50Z" fill="none" stroke="#a2854d" stroke-width="3"/><circle cx="50" cy="50" r="5" fill="#a2854d"/></g></g>
