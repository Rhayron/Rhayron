    <g transform="translate(395 75)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="48s" repeatCount="indefinite"/>
      <g transform="translate(-33 -33) scale(.66)"><path d="M50 50C8 30 17 0 42 12C58 20 50 42 50 50C70 8 100 17 88 42C80 58 58 50 50 50C92 70 83 100 58 88C42 80 50 58 50 50C30 92 0 83 12 58C20 42 42 50 50 50Z" fill="#bccf9d" opacity=".9"/><circle cx="50" cy="50" r="6" fill="#20251f"/></g></g>
      <circle r="12" fill="none" stroke="#bccf9d" stroke-width="1.4" opacity="0"><animate attributeName="r" values="12;60" dur="3.6s" begin="2.9s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="3.6s" begin="2.9s" repeatCount="indefinite"/></circle></g>
    <text x="118" y="26" font-family="'Newsreader','Iowan Old Style','Palatino Linotype',Georgia,serif" font-style="italic" font-size="22" fill="#b7bdab" transform="rotate(5 118 26)">um pouco de vida</text>
    <text x="138" y="52" font-family="'Newsreader','Iowan Old Style','Palatino Linotype',Georgia,serif" font-style="italic" font-size="22" fill="#b7bdab" transform="rotate(5 138 52)">entre as linhas ↙</text>
    <text x="40" y="520" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#b7bdab">SINAL</text>
    <text x="330" y="140" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#b7bdab">PRESENÇA</text>
  </g>

  <!-- copy -->
  <line x1="60" y1="92" x2="88" y2="92" stroke="#bccf9d" stroke-width="1.2"/>
  <text x="100" y="97" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" letter-spacing="2.4" fill="#b7bdab">RHAYRON NOGUEIRA · UM CADERNO VIVO</text>
  <text x="56" y="206" font-family="'Bricolage Grotesque','Archivo','Helvetica Neue',Arial,sans-serif" font-size="104" font-weight="400" letter-spacing="-5" fill="#f0eee1">Do sinal</text>
  <text x="58" y="300" font-family="'Newsreader','Iowan Old Style','Palatino Linotype',Georgia,serif" font-style="italic" font-size="104" letter-spacing="-5" fill="#dbe6c8">à presença.</text>
  <path d="M62 318 Q300 300 548 312" fill="none" stroke="#bccf9d" stroke-width="2.2" opacity=".55" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="520;0" dur="1.4s" begin=".8s" fill="freeze"/></path>
  <text x="60" y="356" font-family="'Newsreader','Iowan Old Style','Palatino Linotype',Georgia,serif" font-size="23" fill="#b7bdab">Engenheiro eletricista. Construo pontes entre</text>
  <text x="60" y="386" font-family="'Newsreader','Iowan Old Style','Palatino Linotype',Georgia,serif" font-size="23" fill="#b7bdab"><tspan fill="#f0eee1">ciência, código e o mundo real.</tspan></text>
  <text x="60" y="422" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" fill="#b7bdab" letter-spacing=".4">Curitiba, Brasil   ·   Caterpillar · UTFPR   ·   2021 a 2026</text>
  <text x="1160" y="422" font-family="'Bricolage Grotesque','Archivo','Helvetica Neue',Arial,sans-serif" font-size="30" fill="#bccf9d" text-anchor="end" opacity=".9">✳</text>
</g>
<rect x=".5" y=".5" width="1199" height="439" rx="26" fill="none" stroke="#434c3e"/>
