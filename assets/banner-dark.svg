    <circle cx="36" cy="470" r="4" fill="#bccf9d"/>
    <path d="M36 470C150 430 90 280 210 290C330 300 300 150 395 75" fill="none" stroke="#bccf9d" stroke-width="1.2" opacity=".25"/>
